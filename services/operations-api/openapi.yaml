openapi: 3.0.3
info:
  title: Operations API
  version: 1.0.0
paths:
  /dashboard:
    get:
      summary: Dashboard overview for the signed-in customer
      description: The customer is identified only by the verified Entra ID bearer token; no customer id is accepted.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer name and held products, ordered accounts, credit cards, loans, fixed deposits, and up to eight recent account and credit card transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          description: Missing or invalid bearer token.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: { type: integer, description: Amount in the currency's minor units }
        currency: { type: string, description: ISO 4217 code }
    DashboardResponse:
      type: object
      required: [customer, products, recentTransactions]
      properties:
        customer:
          type: object
          required: [name]
          properties:
            name: { type: string, nullable: true }
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        recentTransactions:
          type: array
          maxItems: 8
          description: The customer's latest account and credit card transactions, newest first; loan and fixed deposit transactions are never included.
          items:
            $ref: '#/components/schemas/Transaction'
    Transaction:
      type: object
      required: [id, productId, description, category, date, amount]
      properties:
        id: { type: string }
        productId: { type: string, description: Id of the account or credit card in products }
        description: { type: string }
        category: { type: string }
        date: { type: string, format: date }
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Signed minor units, negative for money out, in the product's currency.
    Product:
      type: object
      required: [id, type, name, last4, currency]
      properties:
        id: { type: string }
        type: { type: string, enum: [account, credit_card, loan, fixed_deposit] }
        name: { type: string }
        last4: { type: string, description: Last 4 digits of the product number; the full number is never sent }
        currency: { type: string }
        currentBalance: { $ref: '#/components/schemas/Money' }
        amountOwed: { $ref: '#/components/schemas/Money' }
        availableCredit: { $ref: '#/components/schemas/Money' }
        outstandingBalance: { $ref: '#/components/schemas/Money' }
        depositedAmount: { $ref: '#/components/schemas/Money' }
        maturityDate: { type: string, format: date }
        interestRatePercent: { type: number }
