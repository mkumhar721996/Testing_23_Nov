openapi: 3.0.3
info:
  title: Operations API
  version: 1.0.0
paths:
  /my-work:
    get:
      summary: The signed-in person's open defects and recently updated defects
      description: The person is identified only by the verified Entra ID bearer token (its sub); no person id is accepted. Only defects in projects the person belongs to are returned.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Up to 10 open defects assigned to the person and the 10 most recently modified defects across their projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyWorkResponse'
        '401':
          description: Missing or invalid bearer token.
  /spending/monthly:
    get:
      summary: The signed-in customer's spending by category for the current month
      description: The customer is identified only by the verified bearer token. Totals cover posted debits and card purchases in the calendar month in the given time zone; pending items, transfers in and fees are excluded.
      security:
        - bearerAuth: []
      parameters:
        - name: timeZone
          in: query
          required: false
          description: IANA time zone of the customer. Missing or invalid values fall back to UTC.
          schema:
            type: string
      responses:
        '200':
          description: One total per spending category, largest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlySpendingResponse'
        '401':
          description: Missing or invalid bearer token.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    MonthlySpendingResponse:
      type: object
      required: [month, currency, totalMinor, categories]
      properties:
        month:
          type: string
          description: Month in the customer's time zone, as YYYY-MM.
        currency:
          type: string
        totalMinor:
          type: integer
          description: Sum of all category totals, in minor units.
        categories:
          type: array
          items:
            type: object
            required: [category, totalMinor]
            properties:
              category:
                type: string
                nullable: true
                description: Null for spending that has no category.
              totalMinor:
                type: integer
                description: Spending in minor units (pence).
    MyWorkResponse:
      type: object
      required: [openDefects, recentlyUpdated, hasAnyDefects, projects]
      properties:
        openDefects:
          type: object
          required: [items, total]
          properties:
            items:
              type: array
              maxItems: 10
              description: Defects assigned to the person with a status other than Closed, most recently modified first.
              items:
                $ref: '#/components/schemas/DefectSummary'
            total:
              type: integer
              description: How many open defects are assigned to the person, which can exceed the 10 listed.
        recentlyUpdated:
          type: array
          maxItems: 10
          description: The most recently modified defects across the person's projects, Closed included, newest first.
          items:
            $ref: '#/components/schemas/DefectSummary'
        hasAnyDefects:
          type: boolean
          description: True when a defect is assigned to the person or exists in one of their projects.
        projects:
          type: array
          description: The person's projects.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
    DefectSummary:
      type: object
      required: [id, key, title, severity, status, projectName, createdByName, updatedAt]
      properties:
        id: { type: string }
        key: { type: string, description: Person-facing key, for example DEF-142 }
        title: { type: string }
        severity: { type: string, enum: [Critical, High, Medium, Low] }
        status: { type: string, enum: [New, Open, In Progress, Resolved, Closed, Reopened] }
        projectName: { type: string }
        createdByName: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
